<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日热点汇总</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c1e21;--mu:#6b7280;--ac:#2563eb;--hot:#e11d48;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--tx:#e6e8eb;--mu:#9aa3af;--ac:#7aa7ff;--hot:#ff6b81;--bd:#262b36}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:20px 16px 8px;max-width:820px;margin:0 auto}h1{margin:0;font-size:22px}
.sub{color:var(--mu);font-size:13px;margin-top:4px}
nav{max-width:820px;margin:0 auto;padding:6px 16px;display:flex;gap:8px;flex-wrap:wrap}
nav.p{position:sticky;top:0;background:var(--bg);z-index:5;padding-bottom:10px}
button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:820px;margin:0 auto;padding:4px 16px 60px}
.note{color:var(--mu);font-size:13px;margin:8px 0 12px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.item.hot{border-color:var(--hot)}
.t{font-weight:600}.n{color:var(--mu);margin-right:6px}.hotb{color:var(--hot);font-size:13px;margin-right:4px}
.d{color:var(--mu);font-size:14px;margin-top:4px}.l{margin-top:6px;font-size:14px}.l a{color:var(--ac);margin-right:12px;text-decoration:none}
.h{color:var(--mu);font-size:12px;margin-left:6px}
.all h2{font-size:17px;margin:22px 0 4px;border-left:4px solid var(--ac);padding-left:8px}
</style></head><body>
<header><h1>每日热点汇总</h1><div class="sub">微博 · X · Reddit · 小红书 · 知乎｜🔥 表示多个平台同时出现的话题</div></header>
<nav id="days"></nav><nav id="plats" class="p"></nav><main id="main"></main>
<script>
const DATA=__DATA__;
let day=DATA.order[0],plat="全部";
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function item(it,i){return `<div class="item${it.h?" hot":""}"><div class="t"><span class="n">${i+1}.</span>${it.h?'<span class="hotb">🔥</span>':""}${esc(it.t)}${it.e?`<span class="h">热度 ${esc(it.e)}</span>`:""}</div>${it.d?`<div class="d">${esc(it.d)}</div>`:""}<div class="l">${it.l.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join("")}</div></div>`}
function render(){
  const d=DATA.days[day];
  $("days").innerHTML=DATA.order.map(k=>`<button class="${k==day?"on":""}" onclick="day='${k}';plat='全部';render()">${DATA.days[k].label}</button>`).join("");
  const names=Object.keys(d.p);
  $("plats").innerHTML=["全部",...names].map(n=>`<button class="${n==plat?"on":""}" onclick="plat='${n}';render()">${n}</button>`).join("");
  const show=plat=="全部"?names:[plat];
  $("main").innerHTML='<div class="all">'+show.map(n=>{const p=d.p[n];return `<h2>${n}</h2><div class="note">${esc(p.note)}</div>`+p.items.map(item).join("")}).join("")+"</div>";
  window.scrollTo(0,0);
}
render();
</script></body></html>
